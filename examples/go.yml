# Copy to .github/workflows/ci.yml in a Go module.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: speedysebi/cicd-template/.github/workflows/go-ci.yml@v1
    with:
      golangci-lint: true
