# Copy to .github/workflows/ci.yml in a Node / TypeScript project.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: speedysebi/cicd-template/.github/workflows/node-ci.yml@v1
    # Everything below is optional; the defaults run lint/typecheck/test/build
    # if those scripts exist in package.json.
    with:
      package-manager: npm        # npm | pnpm | yarn | bun
      node-versions: '["22"]'
