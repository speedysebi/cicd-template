# Copy to .github/workflows/ci.yml in a Python project.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: speedysebi/cicd-template/.github/workflows/python-ci.yml@v1
    with:
      python-versions: '["3.12", "3.13"]'
      lint-command: ruff check .     # needs ruff in your dev dependencies
      # typecheck-command: mypy .
