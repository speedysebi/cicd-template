# Copy to .github/workflows/ci.yml in a Bun project.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: speedysebi/cicd-template/.github/workflows/node-ci.yml@v1
    with:
      package-manager: bun
      scripts: "typecheck test"
      # Also check what would be published to npm:
      extra-command: npm pack --dry-run
