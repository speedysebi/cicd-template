# Reusable Docker image build, with optional push (GHCR by default).
#
# The caller must grant `packages: write` when push is true (GHCR):
#
#   jobs:
#     image:
#       permissions: { contents: read, packages: write }
#       uses: speedysebi/cicd-template/.github/workflows/docker.yml@v1
#       with: { push: true }
#
# Docs: docs/workflows/docker.md
name: Docker

on:
  workflow_call:
    inputs:
      context:
        description: "Build context"
        type: string
        default: "."
      file:
        description: "Dockerfile path (relative to the repo root)"
        type: string
        default: Dockerfile
      registry:
        type: string
        default: ghcr.io
      image:
        description: "Image name without registry; empty uses owner/repo"
        type: string
        default: ""
      push:
        description: "Push the image (otherwise build only)"
        type: boolean
        default: false
      platforms:
        description: "Comma-separated target platforms"
        type: string
        default: linux/amd64
      version:
        description: "Extra tag to apply, e.g. the version from release.yml"
        type: string
        default: ""
      build-args:
        description: "Newline-separated KEY=value build args"
        type: string
        default: ""
    secrets:
      REGISTRY_USERNAME:
        description: "Registry user; defaults to github.actor for GHCR"
        required: false
      REGISTRY_PASSWORD:
        description: "Registry password/token; defaults to GITHUB_TOKEN for GHCR"
        required: false
    outputs:
      image:
        description: "Full image name"
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: "Image digest"
        value: ${{ jobs.build.outputs.digest }}

# No permissions block on purpose: the job inherits the caller's token
# permissions, so build-only callers need just `contents: read` and pushing
# callers add `packages: write`. Declaring packages: write here would make the
# workflow invalid for every caller that did not grant it.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image name
        id: name
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE: ${{ inputs.image || github.repository }}
        run: echo "image=${REGISTRY}/${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to registry
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build${{ inputs.push && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
