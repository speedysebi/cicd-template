# Reusable CI for .NET projects: restore, build, test.
#
# Docs: docs/workflows/dotnet-ci.md
name: .NET CI

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: "SDK version(s) for actions/setup-dotnet; newline-separate several"
        type: string
        default: |
          8.0.x
          10.0.x
      os:
        description: 'JSON array of runners'
        type: string
        default: '["ubuntu-latest"]'
      working-directory:
        type: string
        default: "."
      project:
        description: "Solution or project file to build; empty lets dotnet find it"
        type: string
        default: ""
      configuration:
        type: string
        default: Release
      format-check:
        description: "Fail if `dotnet format --verify-no-changes` finds issues"
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 20

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      PROJECT: ${{ inputs.project }}
      CONFIGURATION: ${{ inputs.configuration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore $PROJECT

      - name: Format check
        if: inputs.format-check
        run: dotnet format $PROJECT --verify-no-changes --no-restore

      - name: Build
        run: dotnet build $PROJECT --no-restore --configuration "$CONFIGURATION"

      - name: Test
        run: dotnet test $PROJECT --no-build --configuration "$CONFIGURATION" --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: ${{ inputs.working-directory }}/TestResults
          if-no-files-found: ignore
