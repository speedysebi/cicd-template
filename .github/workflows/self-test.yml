# CI for this repository: lints every workflow, then runs each reusable
# workflow against a tiny fixture project in tests/fixtures/. If this is
# green, the workflows work; tag a release only from a green main.
name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/workflow-lint.yml
    with:
      extra-paths: >-
        examples/node.yml examples/bun.yml examples/python.yml examples/java.yml
        examples/dotnet.yml examples/go.yml examples/workflow-lint.yml
        examples/full-pipeline.yml

  node:
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: tests/fixtures/node
      os: '["ubuntu-latest", "windows-latest"]'
      node-versions: '["22", "24"]'
      artifact-path: dist
      artifact-name: node-fixture-dist

  bun:
    uses: ./.github/workflows/node-ci.yml
    with:
      package-manager: bun
      working-directory: tests/fixtures/node
      install-command: bun install

  pnpm:
    uses: ./.github/workflows/node-ci.yml
    with:
      package-manager: pnpm
      working-directory: tests/fixtures/node-pnpm

  yarn:
    uses: ./.github/workflows/node-ci.yml
    with:
      package-manager: yarn
      working-directory: tests/fixtures/node-yarn

  python:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: tests/fixtures/python
      python-versions: '["3.12", "3.13"]'

  python-uv:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: tests/fixtures/python-uv
      test-command: python -m unittest discover -s tests -t .

  java:
    uses: ./.github/workflows/java-ci.yml
    with:
      working-directory: tests/fixtures/java-maven
      java-versions: '["17", "21"]'

  java-gradle:
    uses: ./.github/workflows/java-ci.yml
    with:
      working-directory: tests/fixtures/java-gradle
      artifact-path: build/libs/*.jar
      artifact-name: gradle-fixture-jar

  dotnet:
    uses: ./.github/workflows/dotnet-ci.yml
    with:
      working-directory: tests/fixtures/dotnet

  go:
    uses: ./.github/workflows/go-ci.yml
    with:
      working-directory: tests/fixtures/go
      golangci-lint: true

  docker:
    uses: ./.github/workflows/docker.yml
    with:
      context: tests/fixtures/docker
      file: tests/fixtures/docker/Dockerfile
      push: false

  release-dry-run:
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      working-directory: tests/fixtures/node
      dry-run: true

  release-version-files:
    strategy:
      fail-fast: false
      matrix:
        fixture: [python-uv, java-gradle, java-maven]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      working-directory: tests/fixtures/${{ matrix.fixture }}
      dry-run: true

  check-release-outputs:
    needs: release-dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Verify outputs
        env:
          VERSION: ${{ needs.release-dry-run.outputs.version }}
          TAG: ${{ needs.release-dry-run.outputs.tag }}
          RELEASED: ${{ needs.release-dry-run.outputs.released }}
        run: |
          echo "version=$VERSION tag=$TAG released=$RELEASED"
          test "$VERSION" = "1.0.0"
          test "$TAG" = "v1.0.0"
          test "$RELEASED" = "false"
